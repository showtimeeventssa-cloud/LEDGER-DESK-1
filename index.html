function total(d){return (d.items||[]).reduce((a,x)=>a+(Number(x.qty)||0)*(Number(x.price)||0),0)}function discount(d){return total(d)*(Number(d.discountRate)||0)/100}function taxable(d){return Math.max(0,total(d)-discount(d))}function tax(d){let rates=Array.isArray(d.taxRates)?d.taxRates.map(Number):[Number(d.taxRate)||0];return rates.reduce((a,r)=>a+taxable(d)*Math.max(0,r||0)/100,0)}function grand(d){return Math.max(0,taxable(d)+tax(d))}function paidAmount(d){return state.payments.filter(p=>p.docId===d.id).reduce((a,p)=>a+(Number(p.amount)||0),0)}function balanceDue(d){return Math.max(0,grand(d)-paidAmount(d))}
function status(d){if(d.type==='quote')return d.status||'Draft';if(d.status==='Paid'||balanceDue(d)<=0.005)return 'Paid';if(paidAmount(d)>0)return 'Part-paid';if(d.dueDate&&d.dueDate<todayISO())return 'Overdue';return d.status||'Outstanding'}
function badge(s){let c=String(s).toLowerCase();if(c==='paid')c='paid';else if(c==='overdue')c='overdue';else if(c==='outstanding')c='outstanding';else if(c==='accepted')c='accepted';else if(c==='converted')c='converted';else if(c==='sent')c='sent';else c='draft';return `<span class="badge ${c}">${esc(s)}</span>`}

function recurringForm(id){if(!state.clients.length){toast('Add a client first.');setPage('clients');return}let r=(state.recurring||[]).find(x=>x.id===id)||{name:'',clientId:'',description:'',frequency:'Monthly',nextDate:todayISO(),active:true,items:[{description:'',qty:1,price:0}],taxRates:[0],discountRate:0,terms:state.settings.terms};let opts=state.clients.map(c=>`<option value="${c.id}" ${r.clientId===c.id?'selected':''}>${esc(c.name)}</option>`).join('');openModal(id?'Edit recurring schedule':'New recurring schedule',`<form id="recurringForm"><div class="formgrid"><div class="field"><label>Schedule name *</label><input name="name" required value="${esc(r.name)}"></div><div class="field"><label>Client *</label><select name="clientId" required><option value="">Select client</option>${opts}</select></div><div class="field"><label>Frequency</label><select name="frequency">${['Weekly','Monthly','Quarterly','Yearly'].map(f=>`<option ${r.frequency===f?'selected':''}>${f}</option>`).join('')}</select></div><div class="field"><label>Next invoice date *</label><input name="nextDate" type="date" required value="${esc(r.nextDate||todayISO())}"></div><div class="field"><label>Tax rates (%) comma-separated</label><input name="taxRates" value="${esc((r.taxRates||[0]).join(', '))}"></div><div class="field"><label>Discount (%)</label><input name="discountRate" type="number" min="0" max="100" step="0.01" value="${Number(r.discountRate)||0}"></div><div class="field full"><label>Description / internal note</label><textarea name="description">${esc(r.description||'')}</textarea></div></div><h3>Recurring line items</h3><div style="overflow:auto"><table class="lineitems"><thead><tr><th>Description</th><th>Qty</th><th>Unit price</th><th></th></tr></thead><tbody id="recurringItems">${(r.items||[]).map((it,i)=>itemRow(it,i)).join('')}</tbody></table></div><button type="button" class="btn small" data-act="addrecurringitem">＋ Add item</button><div class="field" style="margin-top:14px"><la function docHtml(d){let s=state.settings,c=state.clients.find(x=>x.id===d.clientId)||{name:d.clientName||'Client'},isQ=d.type==='quote',sub=total(d),tx=tax(d);let logo=s.logo?`<img src="${s.logo}" style="max-width:140px;max-height:75px;object-fit:contain" alt="Logo">`:`<h1>${esc(s.businessName||'Your Business')}</h1>`;return `<div class="docpreview" id="docpreview"><div class="docbrand"><div>${logo}<div style="font-size:12px;color:#586275;margin-top:9px;white-space:pre-line">${esc(s.address)}${s.email?'\n'+esc(s.email):''}${s.phone?'\n'+esc(s.phone):''}${s.taxNumber?'\nTax/VAT: '+esc(s.taxNumber):''}${s.regNumber?'\nReg: '+esc(s.regNumber):''}</div></div><div class="docmeta"><h2>${isQ?'QUOTE':'INVOICE'}</h2><b>${esc(d.number)}</b><div style="font-size:12px;color:#586275;margin-top:8px">Date: ${date(d.date)}<br>${isQ?'Valid until':'Due date'}: ${date(d.dueDate)}<br>Status: ${esc(status(d))}</div></div></div><div class="docparties"><div><b style="font-size:11px;color:#6b7280;text-transform:uppercase">${isQ?'Quote for':'Bill to'}</b><div style="font-size:17px;font-weight:800;margin-top:7px">${esc(c.name)}</div>${c.company?esc(c.company)+'<br>':''}<span style="font-size:12px;white-space:pre-line;color:#586275">${esc(c.address||'')}${c.email?'\n'+esc(c.email):''}${c.phone?'\n'+esc(c.phone):''}</span></div><div style="font-size:12px;color:#586275"><b style="color:#263247">${isQ?'Quote details':'Payment details'}</b><div style="margin-top:8px">${isQ?'Please review the items and terms below.':'Please use the banking details below when making payment.'}</div></div></div><table><thead><tr><th>Description</th><th>Qty</th><th>Unit price</th><th style="text-align:right">Amount</th></tr></thead><tbody>${(d.items||[]).map(i=>`<tr><td>${esc(i.description)}</td><td>${Number(i.qty)}</td><td>${money(i.price)}</td><td style="text-align:right;font-weight:700">${money(i.qty*i.price)}</td></tr>`).join('')}</tbody></table><div class="docsum"><div><span>Subtotal</span><span>${money(sub)}</span></div>${Number(d.discountRate)?`<div><span>Discount (${Number(d.discountRate)}%)</span><span>− ${money(discount(d))}</span></div>`:''}${(d.taxRates||[Number(d.taxRate)||0]).map(r=>`<div><span>Tax (${Number(r)}%)</span><span>${money(taxable(d)*Number(r)/100)}</span></div>`).join('')}<div class="final"><span>Total</span><span>${money(sub+tx)}</span></div></div>${d.notes?`<div style="margin-top:25px;font-size:12px"><b>Notes</b><p style="white-space:pre-line">${esc(d.notes)}</p></div>`:''}${d.showBank&& (s.bankName||s.accountNumber)?`<div class="bank"><b>Banking details</b>\n${esc(s.bankName)}${s.accountName?'\nAccount holder: '+esc(s.accountName):''}${s.accountNumber?'\nAccount number: '+esc(s.accountNumber):''}${s.branchCode?'\nBranch code: '+esc(s.branchCode):''}${s.accountType?'\nAccount type: '+esc(s.accountType):''}</div>`:''}${d.terms?`<div style="margin-top:18px;font-size:11px;color:#596579"><b>Terms & conditions</b><p style="white-space:pre-line">${esc(d.terms)}</p></div>`:''}<div style="margin-top:35px;padding-top:12px;border-top:1px solid #e5e9f1;text-align:center;color:#81899a;font-size:10px">Thank you for your business.</div></div>`}
function viewDoc(id){let d=state.docs.find(x=>x.id===id);if(!d)return;modalDoc=d;openModal(`${d.type==='quote'?'Quote':'Invoice'} · ${d.number}`,docHtml(d),`<button class="btn danger" data-act="deletedoc" data-id="${d.id}">Delete</button><div class="footright">${d.type==='invoice'&&balanceDue(d)>0.005?`<button class="btn" data-act="addpayment" data-id="${d.id}">＋ Record payment</button>`:''}${d.type==='invoice'&&paidAmount(d)>0?`<button class="btn" data-act="receipt" data-id="${d.id}">Receipt</button>`:''}${d.type==='quote'&&d.status!=='Converted'?`<button class="btn" data-act="convert" data-id="${d.id}">Convert to invoice</button>`:''}<button class="btn" data-act="editdoc" data-id="${d.id}">Edit</button><button class="btn primary" data-act="pdf" data-id="${d.id}">↓ Download PDF</button></div>`)}
function editDoc(id){let d=state.docs.find(x=>x.id===id);if(!d)return;closeModal();docForm(d.type,d)}
function convertQuote(id){let q=state.docs.find(x=>x.id===id);if(!q||q.type!=='quote')return;if(!confirm(`Convert ${q.number} to an invoice? A new invoice will be created and the quote marked converted.`))return;let inv=structuredClone(q);inv.id=uid();inv.type='invoice';inv.number=`${state.settings.prefixInvoice||'INV'}-${String(state.settings.nextInvoice++).padStart(4,'0')}`;inv.status='Outstanding';inv.paidDate='';inv.createdAt=new Date().toISOString();inv.updatedAt=inv.createdAt;inv.sourceQuoteId=q.id;q.status='Converted';q.convertedTo=inv.id;state.docs.push(inv);save();closeModal();setPage('invoices');toast(`Created invoice ${inv.number}.`)}
function deleteDoc(id){let d=state.docs.find(x=>x.id===id);if(!d)return;if(!confirm(`Delete ${d.type} ${d.number}? This cannot be undone unless you have a backup.`))return;state.docs=state.docs.filter(x=>x.id!==id);state.payments=state.payments.filter(x=>x.docId!==id);save();closeModal();render();toast('Document deleted.')}
function deleteClient(id){let c=state.clients.find(x=>x.id===id);if(!c)return;if(state.docs.some(d=>d.clientId===id)){toast('This client has documents. Delete or reassign those documents first.');return}if(!confirm(`Delete client ${c.name}?`))return;state.clients=state.clients.filter(x=>x.id!==id);save();render();toast('Client deleted.')}
function saveClient(id){let f=$('#clientForm');if(!f.reportValidity())return;let x=Object.fromEntries(new FormData(f).entries());x.id=id||uid();if(id){let i=state.clients.findIndex(c=>c.id===id);if(i>=0)state.clients[i]={...state.clients[i],...x}}else state.clients.push(x);save();closeModal();render();toast('Client saved.')}
function saveSettings(){let s=state.settings;['businessName','email','phone','address','taxNumber','regNumber','currency','symbol','prefixInvoice','prefixQuote','terms','bankName','accountName','accountNumber','branchCode','accountType'].forEach(k=>{let el=$('#s-'+k);if(el)s[k]=el.value});['nextInvoice','nextQuote'].forEach(k=>{let el=$('#s-'+k);if(el)s[k]=Math.max(1,Number(el.value)||1)});if(!s.symbol){let symbols={ZAR:'R',USD:'$',GBP:'£',EUR:'€',AUD:'A$',NAD:'N$',BWP:'P'};s.symbol=symbols[s.currency]||s.currency+' '}save();render();toast('Business settings saved.')}
function download(name,content,type){let blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function backup(){download('ledgerdesk-backup-'+todayISO()+'.json',JSON.stringify({...state,backupVersion:1,exportedAt:new Date().toISOString()},null,2),'application/json');toast('Backup downloaded.')}
function restore(){let f=$('#restoreFile')?.files?.[0];if(!f){toast('Choose a backup JSON file first.');return}if(!confirm('Replace all current browser data with this backup? Download a backup first if needed.'))return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.clients)||!Array.isArray(x.docs)||!x.settings)throw Error('Not a LedgerDesk backup');state={...structuredClone(defaultState),...x,settings:{...defaultState.settings,...x.settings},products:Array.isArray(x.products)?x.products:[],recurring:Array.isArray(x.recurring)?x.recurring:[],payments:Array.isArray(x.payments)?x.payments:[]};save();setPage('dashboard');toast('Backup restored.')}catch(e){toast('Could not restore this file. Check that it is a valid LedgerDesk JSON backup.')}};r.readAsText(f)}
function csvExport(){let rows=[['Type','Number','Client','Date','Due date','Status','Subtotal','Discount %','Tax rates %','Tax amount','Total','Amount paid','Balance','Paid date']];state.docs.forEach(d=>{let c=state.clients.find(x=>x.id===d.clientId);rows.push([d.type,d.number,c?.name||d.clientName||'',d.date,d.dueDate,status(d),total(d),d.discountRate||0,(d.taxRates||[d.taxRate||0]).join(' + '),tax(d),grand(d),paidAmount(d),balanceDue(d),d.paidDate||''])});let csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');download('ledgerdesk-documents-'+todayISO()+'.csv','\ufeff'+csv,'text/csv;charset=utf-8');toast('CSV exported.')}
function downloadPDF(id){let d=state.docs.find(x=>x.id===id)||modalDoc;if(!d)return;let html=docHtml(d);let w=window.open('','_blank');if(!w){toast('Pop-up blocked. Allow pop-ups to print/save as PDF.');return}w.document.write(`<!doctype html><html><head><title>${esc(d.number)}</title><meta charset="utf-8"><style>body{font:13px Arial;color:#1b2435;margin:25px}.docpreview{max-width:850px;margin:auto}.docbrand{display:flex;justify-content:space-between;border-bottom:2px solid #243d7b;padding-bottom:20px}.docmeta{text-align:right}.docmeta h2{color:#315ee8}.docparties{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:25px 0}.docpreview table{width:100%;border-collapse:collapse}.docpreview th{background:#f2f5fa;text-align:left;padding:10px}.docpreview td{padding:10px;border-bottom:1px solid #e7eaf0}.docsum{margin:20px 0 0 auto;width:270px}.docsum div{display:flex;justify-content:space-between;padding:6px}.docsum .final{font-weight:bold;border-top:2px solid #243d7b;font-size:17px;padding-top:12px}.bank{margin-top:30px;padding:15px;background:#f7f8fb;white-space:pre-line}.docbrand h1{font-size:27px;margin:0}@page{size:A4;margin:15mm}@media print{body{margin:0}}</style></head><body>${html}<script>window.onload=()=>setTimeout(()=>window.print(),350)<\/script></body></html>`);w.document.close();toast('In the print dialog, choose “Save as PDF”.')}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b)setPage(b.dataset.page)});$('#sidebar').addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b&&b.closest('.nav')&&!b.closest('#nav'))setPage(b.dataset.page)});$('#view').addEventListener('click',e=>{let b=e.target.closest('[data-page],[data-act],[data-stab]');if(!b)return;if(b.dataset.page){setPage(b.dataset.page);return}if(b.dataset.stab){settingsTab=b.dataset.stab;render();return}let a=b.dataset.act,id=b.dataset.id;switch(a){case'newclient':clientForm();break;case'newproduct':productForm();break;case'editproduct':productForm(id);break;case'deleteproduct':deleteProduct(id);break;case'saveproduct':saveProduct(id);break;case'newrecurring':recurringForm();break;case'editrecurring':recurringForm(id);break;case'saverecurring':saveRecurring(id);break;case'generaterecurring':generateRecurring(id);break;case'togglerecurring':{let r=(state.recurring||[]).find(x=>x.id===id);if(r){r.active=!r.active;save();render()}break}case'deleterecurring':if(confirm('Delete this recurring schedule? Existing invoices are kept.')){state.recurring=(state.recurring||[]).filter(x=>x.id!==id);save();render()}break;case'usecatalog':{let pid=$('#catalogPick')?.value,p=(state.products||[]).find(x=>x.id===pid);if(p){let body=$('#itemsBody');body.insertAdjacentHTML('beforeend',itemRow({description:p.name+(p.description?' — '+p.description:''),qty:1,price:p.price},body.children.length));calcFormTotals()}break}case'addrecurringitem':{let body=$('#recurringItems');body.insertAdjacentHTML('beforeend',itemRow({description:'',qty:1,price:0},body.children.length));break}case'editclient':clientForm(state.clients.find(c=>c.id===id)||{});break;case'deleteclient':deleteClient(id);break;case'newinvoice':docForm('invoice');break;case'newquote':docForm('quote');break;case'viewdoc':viewDoc(id);break;case'editdoc':editDoc(id);break;case'convert':convertQuote(id||modalDoc?.id);break;case'deletedoc':deleteDoc(id);break;case'markpaid':{let d=state.docs.find(x=>x.id===id);if(d){markPaid(d);viewDoc(id)}break}case'addpayment':paymentForm(id);break;case'receipt':receipt(id);break;case'closemodal':closeModal();break;case'saveclient':saveClient(id);break;case'savesettings':saveSettings();break;case'additem':{let body=$('#itemsBody');body.insertAdjacentHTML('beforeend',itemRow({description:'',qty:1,price:0},body.children.length));calcFormTotals();break}case'removeitem':b.closest('tr').remove();$$('#itemsBody .del').forEach((x,i)=>x.dataset.index=i);calcFormTotals();break;case'saveDoc':saveDoc();break;case'pdf':downloadPDF(id);break;case'backup':backup();break;case'restore':restore();break;case'exportcsv':csvExport();break;case'removelogo':state.settings.logo='';save();render();break}});
$('#view').addEventListener('input',e=>{if(e.target.id==='productSearch'){productSearch=e.target.value;let pos=e.target.selectionStart;render();let n=$('#productSearch');n.focus();n.setSelectionRange(pos,pos)}if(e.target.id==='clientSearch'){clientSearch=e.target.value;let pos=e.target.selectionStart;render();let n=$('#clientSearch');n.focus();n.setSelectionRange(pos,pos)}if(e.target.id==='docSearch'){let pos=e.target.selectionStart;let val=e.target.value;render();let n=$('#docSearch');if(n){n.focus();n.setSelectionRange(pos,pos)}}if(e.target.matches('[data-item],#docForm [name=taxRate]'))calcFormTotals()});$('#view').addEventListener('change',e=>{if(e.target.id==='docFilter'){docFilter=e.target.value;render()}if(e.target.id==='logoFile'){let f=e.target.files?.[0];if(!f)return;if(f.size>1.5*1024*1024){toast('Logo is too large. Please use an image under 1.5 MB.');e.target.value='';return}let r=new FileReader();r.onload=()=>{state.settings.logo=r.result;save();render();toast('Logo saved.')};r.readAsDataURL(f)}});
$('#modalbody').addEventListener('input',e=>{if(e.target.matches('[data-item],#docForm [name=taxRate]'))calcFormTotals()});$('#modalbody').addEventListener('click',e=>{let b=e.target.closest('[data-act]');if(!b)return;if(b.dataset.act==='usecatalog'){let pid=$('#catalogPick')?.value,p=(state.products||[]).find(x=>x.id===pid);if(!pid){toast('Choose a saved product or service first.');return}if(p){let body=$('#itemsBody');if(!body){toast('Line items are not available in this form.');return}body.insertAdjacentHTML('beforeend',itemRow({description:p.name+(p.description?' — '+p.description:''),qty:1,price:Number(p.price)||0},body.children.length));calcFormTotals();toast('Saved item added to the document.')}}if(b.dataset.act==='additem'){let body=$('#itemsBody');body.insertAdjacentHTML('beforeend',itemRow({description:'',qty:1,price:0},body.children.length));calcFormTotals()}if(b.dataset.act==='addrecurringitem'){let body=$('#recurringItems');body.insertAdjacentHTML('beforeend',itemRow({description:'',qty:1,price:0},body.children.length))}if(b.dataset.act==='removeitem'){b.closest('tr').remove();$$('#itemsBody .del,#recurringItems .del').forEach((x,i)=>x.dataset.index=i);if($('#itemsBody'))calcFormTotals()}});$('#modalfoot').addEventListener('click',e=>{let b=e.target.closest('[data-act]');if(!b)return;let a=b.dataset.act,id=b.dataset.id;if(a==='closemodal')closeModal();else if(a==='savepayment')savePayment(id);else if(a==='saveclient')saveClient(id);else if(a==='saveproduct')saveProduct(id);else if(a==='saverecurring')saveRecurring(id);else if(a==='saveDoc')saveDoc();else if(a==='pdf')downloadPDF(id);else if(a==='deletedoc')deleteDoc(id);else if(a==='editdoc')editDoc(id);else if(a==='markpaid'){let d=state.docs.find(x=>x.id===id);if(d){markPaid(d);viewDoc(id)}}else if(a==='convert')convertQuote(id||modalDoc?.id)});
$('#closeModal').addEventListener('click',closeModal);$('#modalback').addEventListener('click',e=>{if(e.target===$('#modalback'))closeModal()});$('#menuBtn').addEventListener('click',()=>$('#sidebar').classList.toggle('open'));document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
// Intercept form submission so browser validation remains active without navigation.
document.addEventListener('submit',e=>{if(e.target.id==='clientForm'||e.target.id==='docForm')e.preventDefault()});
// Browser-local first-run notice
updateBrand();render();
})();
</script>
</body></html>
